name: Bot de Futebol

on:
  schedule:
    # A cada 30 minutos, das 07:00 às 03:30 (horário de Brasília). O GitHub usa horário UTC.
    - cron: "*/30 10-23 * * *"
    - cron: "*/30 0-6 * * *"
  workflow_dispatch:   # permite rodar na mão pelo botão "Run workflow"
    inputs:
      modo:
        description: "auto, agenda ou resultados"
        default: "auto"
      forcar:
        description: "Forçar envio mesmo se já enviou? (sim/nao)"
        default: "nao"

permissions:
  contents: write

concurrency:
  group: bot-futebol
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODO="${{ github.event.inputs.modo || 'auto' }}"
          if [ "${{ github.event.inputs.forcar }}" = "sim" ]; then
            python bot.py "$MODO" --forcar
          else
            python bot.py "$MODO"
          fi

      - name: Salvar o que já foi enviado
        run: |
          git config user.name "bot-futebol"
          git config user.email "bot-futebol@users.noreply.github.com"
          git add estado.json || true
          git diff --cached --quiet || (git commit -m "atualiza estado" && git push)
